services:
  # Flask API (generates sites with Claude and commits them to GitHub)
  - type: web
    runtime: python
    name: generate-site-api
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 2 --threads 4
    healthCheckPath: /api/hello
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Signs the login sessions; Render generates it once and keeps it.
      - key: SECRET_KEY
        generateValue: true
      # OAuth client ID for "Sign in with Google" (Google Cloud Console > Credentials)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Users, their GitHub tokens (encrypted with SECRET_KEY) and generation costs
      # stored in SQLite. Without a persistent disk the file is lost on every deploy or restart:
      # attach a disk (paid plans) and set SQLITE_PATH to a file on it, e.g. /var/data/data.db
      # Resend API key for the email sent after each generation (https://resend.com)
      - key: RESEND_API_KEY
        sync: false
      # Sender address on a domain verified in Resend, e.g. "Generate Site <noreply@example.com>"
      - key: MAIL_FROM
        sync: false
      - key: GITHUB_REPO
        value: SlavkoPar/AIGeneratedSite
      - key: GITHUB_BRANCH
        value: main

  # React UI; calls the Flask service above via VITE_API_URL
  - type: web
    runtime: static
    name: generate-site-ui
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Call the API directly: long generations would time out behind a static-site rewrite
      - key: VITE_API_URL
        value: https://generate-site-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
